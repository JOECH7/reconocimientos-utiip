<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reconocimientos UTIIP 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0F3849;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .label {
    font-size: 12px;
    letter-spacing: 3px;
    color: #00D6DC;
    margin-bottom: 14px;
  }
  .divider {
    width: 60px;
    height: 2px;
    background: #FF535F;
    margin-bottom: 28px;
    border: none;
  }
  .frame {
    width: 100%;
    max-width: 900px;
    border: 2px solid #0097B2;
    border-radius: 16px;
    padding: 14px;
    background: rgba(1, 105, 184, 0.08);
  }
  video {
    width: 100%;
    display: block;
    border-radius: 10px;
    background: #08161c;
  }
  .caption {
    margin-top: 20px;
    font-size: 13px;
    color: #5DCAA5;
  }
</style>
</head>
<body>
  <div class="label">UTIIP &middot; PMO</div>
  <hr class="divider">
  <div class="frame">
    <video src="Video_Reconocimientos_UTIIP_2026.mp4" controls playsinline></video>
  </div>
  <div class="caption">Reconocimiento oficial &middot; 2026</div>
</body>
</html>
